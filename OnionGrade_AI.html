<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OnionGrade AI</title>
<style>
:root{--bg:#1b0f22;--panel:#2a1a34;--line:#43284f;--ink:#efe8f2;--dim:#b7a6c0;--onion:#c23a78;--leaf:#9bcb7a;--amber:#e0a23c;--red:#e5484d;--slate:#7d8aa0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:700;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
nav{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--dim);padding:10px 2px;font-size:11px}
nav button[aria-current=page]{color:var(--leaf);box-shadow:inset 0 2px 0 var(--leaf)}
.banner{padding:7px 12px;font-size:12px;font-weight:600;color:#fff;border-radius:6px;margin-bottom:10px}
.b-demo{background:#a85f0a}.b-warn{background:#a3252b}.b-ok{background:#2f7a3d}
.btn{background:var(--onion);color:#fff;border:0;border-radius:8px;padding:12px 16px;width:100%;font-weight:600}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn+.btn{margin-top:8px}
.btn:disabled{opacity:.4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.dim{color:var(--dim);font-size:13px}
.hero h1{font-size:30px;line-height:1.1;margin:6px 0 10px}
.stage{position:relative;background:#120a17;border-radius:10px;overflow:hidden;aspect-ratio:3/4;border:1px solid var(--line)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--panel);width:100%;max-width:560px;max-height:85%;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px}
.kv b{display:block;font-size:12px;color:var(--leaf);margin-top:10px}
label{display:block;margin:10px 0}
select,input[type=range],input[type=text],input[type=password]{width:100%}
select,input[type=text],input[type=password]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.ok{color:var(--leaf)}.fail{color:var(--red)}.chk{color:var(--amber)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <nav id="nav"></nav>
</div>

<script>
/* ============ DATA (mirrors assets/standards/standards.json) ============ */
const R=(g,d,max,manual,text,src)=>({g,d,max,manual,text,src});
const EU_RULES=[
 R('class1','shape',null,0,'a slight defect in shape','eur36589.pdf, Class I'),
 R('class1','colour',null,0,'a slight defect in colouring','eur36589.pdf, Class I'),
 R('class1','staining',20,0,'light staining not affecting last dried skin, max one-fifth of bulb surface','eur36589.pdf, Class I'),
 R('class1','cracks',null,1,'superficial cracks, provided flesh is protected','eur36589.pdf, Class I'),
 R('class1','skinLoss',null,1,'absence of part of outer skins, provided flesh is protected','eur36589.pdf, Class I'),
 R('class2','shape',null,0,'defects in shape','eur36589.pdf, Class II'),
 R('class2','colour',null,0,'defects in colouring','eur36589.pdf, Class II'),
 R('class2','sprouting',null,0,'early signs of shoot growth (lot limit 10% by number or weight)','eur36589.pdf, Class II'),
 R('class2','rubbing',null,0,'traces of rubbing','eur36589.pdf, Class II'),
 R('class2','diseaseMarking',null,1,'slight marking caused by parasites or disease','eur36589.pdf, Class II'),
 R('class2','bruising',null,1,'slight bruising, healed, unlikely to impair keeping quality','eur36589.pdf, Class II'),
 R('class2','rootTuft',null,0,'may have root tufts','eur36589.pdf, Class II'),
 R('class2','staining',50,0,'staining not affecting last dried skin, max half of bulb surface','msu.edu copy of Reg. 2213/83 / eur36268.pdf'),
 R('class2','cracks',33.3,1,'cracks / absent outer skin on max 1/3 of surface, flesh intact','msu.edu copy of Reg. 2213/83'),
 R('class2','skinLoss',33.3,1,'absent outer skin on max 1/3 of surface, flesh intact','msu.edu copy of Reg. 2213/83')
];
const GRADES=[{id:'extra',name:'Extra Class'},{id:'class1',name:'Class I'},{id:'class2',name:'Class II'}];
const STANDARDS=[
 {id:'AGMARK_ONION',name:'Indian AGMARK (Onion)',authority:'Directorate of Marketing & Inspection, Govt. of India',country:'IN',version:'PLACEHOLDER-0',verified:false,
  doc:'AGMARKNET Onion Commodity Profile',url:'https://agmarknet.gov.in/Others/Onion.pdf',
  note:'UNVERIFIED. The official PDF could not be fetched during build. Rule values are a PLACEHOLDER copied from the EU text, NOT confirmed AGMARK values. Replace from the official PDF before any real use.',
  rules:EU_RULES.map(r=>({...r,text:'PLACEHOLDER: '+r.text,src:'UNVERIFIED'}))},
 {id:'EU_2213_83_ONION',name:'EU/UNECE-style onion standard (Reg. 2213/83)',authority:'European Communities / UNECE-aligned',country:'EU',version:'2001-07-25 consolidated (OJ L 200/17)',verified:true,
  doc:'Commission Regulation quality standard for onions (FAOLEX copy)',url:'https://faolex.fao.org/docs/pdf/eur36589.pdf',
  note:'Class I/II values from FAOLEX text found in search snippets. Extra Class = "no defects permitted" is an assumption, not sourced.',
  rules:EU_RULES}
];
const DEFECTS={rot:'Surface rot/decay',fungal:'Fungal/microbial damage',bruising:'Bruising',cracks:'Cracks',skinLoss:'Outer skin loss',staining:'Staining',rubbing:'Rubbing/abrasion',sprouting:'Sprouting',diseaseMarking:'Disease/parasite marking',shape:'Shape abnormality',colour:'Colour abnormality',rootTuft:'Root tuft'};
const NEVER=['rot','fungal'];
const REF=[
 {id:'REF_0001',auth:'ICAR',page:'https://www.icar.gov.in/en/landmark-varieties'},
 {id:'REF_0002',auth:'ICAR',page:'https://www.icar.gov.in/en/node/2087'},
 {id:'REF_0003',auth:'APEDA',page:'https://apeda.gov.in/FreshOnions'}];
const VARIETIES=['Agrifound Dark Red','Agrifound Light Red','NHRDF Red','Agrifound White','Agrifound Rose','Agrifound Red','Pusa Ratnar','Pusa Red','Pusa White Round','Bhima Super','Bhima Dark Red','Bhima Red','Bhima Shweta','Bhima Shubhra'];
const NOTICE='Assessment is based on visible surface characteristics only. AI prediction is not an official grade or a human inspection.';

/* ============ STANDARDS ENGINE (rules decide; AI only observes) ============ */
function evaluate(o,std,minConf){
  if(o.conf<minConf||o.defects.some(d=>d.conf<minConf))
    return {grade:'Needs manual inspection',manual:true,std,criteria:[],why:`Confidence below ${Math.round(minConf*100)}% threshold. No grade forced. Manual inspection recommended.`};
  let last=[];
  for(const g of GRADES){
    const crit=[];let fail=false,manual=false;
    for(const d of o.defects){
      const rule=NEVER.includes(d.type)?null:std.rules.find(r=>r.g===g.id&&r.d===d.type);
      const nm=DEFECTS[d.type];
      if(!rule){crit.push({nm,area:d.area,rule:`Not permitted in ${g.name}`,st:'fail'});fail=true}
      else if(rule.max!=null&&d.area>rule.max){crit.push({nm,area:d.area,rule:`${rule.text} (max ${rule.max}%)`,st:'fail'});fail=true}
      else if(rule.manual){crit.push({nm,area:d.area,rule:`${rule.text} - needs human check`,st:'chk'});manual=true}
      else crit.push({nm,area:d.area,rule:rule.text,st:'ok'});
    }
    last=crit;
    if(!fail){
      const base=o.defects.length?`All detected visible defects are within ${g.name} limits of ${std.name}.`:'No visible surface defects detected.';
      return {grade:g.name,manual,std,criteria:crit,why:base+(manual?' Some criteria depend on conditions a camera cannot confirm (e.g. flesh protected). Human check advised.':'')};
    }
  }
  return {grade:'Unclassified',manual:false,std,criteria:last,why:`Detected visible defects exceed every grade in ${std.name}.`};
}

/* ============ SIMULATED INFERENCE (fallback when no model is connected) ============ */
function seeded(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function demoInfer(scene){
  const r=seeded(scene*7919+13),n=5+Math.floor(r()*4),out=[];
  const types=['staining','bruising','cracks','sprouting','rot','skinLoss','rubbing'];
  for(let i=0;i<n;i++){
    const col=i%3,row=Math.floor(i/3),cx=.2+col*.3+r()*.04,cy=.2+row*.25+r()*.04,s=.09+r()*.02;
    const defects=r()>.35?[{type:types[Math.floor(r()*types.length)],area:5+Math.floor(r()*50),conf:.5+r()*.5}]:[];
    out.push({id:i+1,box:[cx-s,cy-s,cx+s,cy+s],conf:.8+r()*.19,defects});
  }
  return out;
}

/* ============ LIVE INFERENCE (your trained Roboflow model) ============ */
// Captures one still frame, sends it to your Roboflow Hosted Inference API endpoint,
// and maps the response (cuts/rotten/sprout regions) onto this app's onion/defect shape.
function grabFrameB64(video,cv){
  const w=video.videoWidth||cv.width,h=video.videoHeight||cv.height;
  const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;
  const tctx=tmp.getContext('2d');
  if(video&&!video.hidden&&video.videoWidth)tctx.drawImage(video,0,0,w,h);
  else tctx.drawImage(cv,0,0,w,h); // no camera: send whatever is on the stage canvas
  return {b64:tmp.toDataURL('image/jpeg',0.85).split(',')[1],w,h};
}
async function roboflowInfer(video,cv){
  const {endpoint,key}=rfConfig();
  if(!endpoint||!key)throw new Error('Model not connected. Add your Roboflow endpoint + API key in Settings.');
  const {b64,w,h}=grabFrameB64(video,cv);
  const url=endpoint.replace(/\/$/,'')+(endpoint.includes('?')?'&':'?')+'api_key='+encodeURIComponent(key);
  const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b64});
  if(!resp.ok)throw new Error('Roboflow API error '+resp.status+': '+(await resp.text()).slice(0,200));
  const data=await resp.json();
  const preds=data.predictions||[];
  const iw=(data.image&&Number(data.image.width))||w,ih=(data.image&&Number(data.image.height))||h;
  return preds.map((p,i)=>{
    const bw=p.width/iw,bh=p.height/ih,cx=p.x/iw,cy=p.y/ih;
    const box=[cx-bw/2,cy-bh/2,cx+bw/2,cy+bh/2];
    const rawType=(p.class||'').toLowerCase();
    const type=CLASS_MAP[rawType]||rawType;
    const area=Math.round(Math.max(1,Math.min(100,bw*bh*100*6))); // rough visible-area estimate from box size
    return {id:i+1,box,conf:p.confidence!=null?p.confidence:0.5,defects:[{type,area,conf:p.confidence!=null?p.confidence:0.5}]};
  });
}

/* ============ ROBOFLOW MODEL CONNECTION ============ */
/* Your trained classes were: cuts ; rotten ; sprout. Mapped onto this app's existing
   defect vocabulary so the standards/rules engine (which was built around cracks/rot/
   sprouting) can score them without changes. Edit this map any time your class names change. */
const CLASS_MAP={cuts:'cracks',rotten:'rot',sprout:'sprouting'};
function rfConfig(){
  const DEFAULT_ENDPOINT='https://serverless.roboflow.com/rakshit-shetty/onion-inspection-bnyuo-2-rfdetr-nas-pecoret-t1--718e59';
  try{return {endpoint:localStorage.getItem('og_rf_endpoint')||DEFAULT_ENDPOINT,key:localStorage.getItem('og_rf_key')||''}}catch(e){return {endpoint:DEFAULT_ENDPOINT,key:''}}
}
function rfConfigured(){const c=rfConfig();return !!(c.endpoint&&c.key)}

/* ============ STATE ============ */
const S={tab:'home',stdId:'AGMARK_ONION',minConf:.7,results:[],scene:1,timer:null,stream:null,history:[],busy:false};
try{const h=localStorage.getItem('og_hist');if(h)S.history=JSON.parse(h);const s=localStorage.getItem('og_std');if(s)S.stdId=s}catch(e){}
const std=()=>STANDARDS.find(s=>s.id===S.stdId);
const saveH=()=>{try{localStorage.setItem('og_hist',JSON.stringify(S.history));localStorage.setItem('og_std',S.stdId)}catch(e){}};
const gcol=g=>({'Extra Class':'#2f9e44','Class I':'#7cb342','Class II':'#e0a23c','Needs manual inspection':'#7d8aa0'})[g]||'#e5484d';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const stdBanner=()=>std().verified?'':'<div class="banner b-warn">STANDARD UNVERIFIED: rule values are placeholders, not confirmed official values.</div>';
const demoBanner='<div class="banner b-demo">DEMO / SIMULATED: results are fake, not AI output. No trained model is connected. Set your Roboflow endpoint in Settings.</div>';
const liveBanner='<div class="banner b-ok">LIVE MODEL: results come from your trained Roboflow model.</div>';
const modelBanner=()=>rfConfigured()?liveBanner:demoBanner;

/* ============ VIEWS ============ */
const TABS=[['home','Home'],['scan','Scan'],['standards','Standards'],['ref','Reference'],['history','History'],['more','More']];
function nav(){document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" ${S.tab===k?'aria-current="page"':''}>${l}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t))}
function go(t){stopScan();S.tab=t;nav();render();document.getElementById('view').scrollTop=0}
function render(){const v=document.getElementById('view');({home,scan,standards,ref,history,more})[S.tab](v)}

function home(v){
  v.innerHTML=`<div class="hero"><h1>AI-Powered Onion Quality Assessment</h1><p class="dim">${NOTICE}</p></div>
  ${modelBanner()}${stdBanner()}
  <button class="btn" data-g="scan">START SCANNING</button>
  <button class="btn alt" data-g="standards">VIEW STANDARDS</button>
  <button class="btn alt" data-g="ref">REFERENCE LIBRARY</button>
  <button class="btn alt" data-g="history">SCAN HISTORY</button>
  <div class="card dim">Pipeline: camera frame &rarr; your Roboflow-trained model detects visible defects (cuts, rotten, sprout) &rarr; area estimated from the detection box &rarr; a rules engine applies the selected standard. The model reports what is visible; the standard decides the class.${rfConfigured()?'':' Not connected yet \u2014 set your model endpoint in Settings.'}</div>`;
  v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go(b.dataset.g));
}

function scan(v){
  const live=rfConfigured();
  v.innerHTML=`${modelBanner()}${stdBanner()}
  <div class="stage" id="stage"><video id="vid" playsinline muted hidden></video><canvas id="cv"></canvas></div>
  <div class="card row"><div id="sum" class="dim">${live?'Point the camera at onions, then tap Analyze.':'Starting demo loop...'}</div><button class="btn" id="rep" style="width:auto" disabled>Batch report</button></div>
  <button class="btn alt" id="camBtn">Use phone camera as background</button>
  ${live?'<button class="btn" id="analyzeBtn">Analyze frame</button>':''}
  <p class="dim">${live?'Each tap sends one still frame to your Roboflow model and draws back real detections.':'The camera feed is only a backdrop here. Detections are simulated. Frames never leave your device.'}</p>`;
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),vid=document.getElementById('vid');
  const fit=()=>{const b=cv.getBoundingClientRect();cv.width=b.width*devicePixelRatio;cv.height=b.height*devicePixelRatio};
  fit();

  document.getElementById('camBtn').onclick=async()=>{
    try{S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      vid.srcObject=S.stream;vid.hidden=false;await vid.play();document.getElementById('camBtn').hidden=true}
    catch(e){document.getElementById('camBtn').textContent='Camera unavailable: '+e.message}
  };
  document.getElementById('rep').onclick=()=>report({time:new Date().toISOString(),sim:!live,std:std().name,onions:S.results});

  if(live){
    const sum=document.getElementById('sum'),ab=document.getElementById('analyzeBtn');
    ab.onclick=async()=>{
      if(S.busy)return;S.busy=true;ab.disabled=true;sum.textContent='Analyzing with your model...';
      try{
        const dets=await roboflowInfer(vid,cv);
        S.results=dets.map(o=>({obs:o,g:evaluate(o,std(),S.minConf)}));
        draw(ctx,cv);summary();
      }catch(e){sum.textContent='Error: '+e.message}
      finally{S.busy=false;ab.disabled=false}
    };
  }else{
    let tick=0;
    const step=()=>{
      if(tick%6===0)S.scene++; tick++;
      S.results=demoInfer(S.scene).map(o=>({obs:o,g:evaluate(o,std(),S.minConf)}));
      draw(ctx,cv);summary();
    };
    step();S.timer=setInterval(step,500);
  }
}
function stopScan(){clearInterval(S.timer);S.timer=null;if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}}
function summary(){
  const c={};S.results.forEach(r=>c[r.g.grade]=(c[r.g.grade]||0)+1);
  document.getElementById('sum').textContent=`Detected ${S.results.length}  ${Object.entries(c).map(([k,n])=>k+': '+n).join('  ')}`;
  document.getElementById('rep').disabled=!S.results.length;
}
function draw(ctx,cv){
  const W=cv.width,H=cv.height,k=devicePixelRatio;ctx.clearRect(0,0,W,H);
  if(document.getElementById('vid').hidden){ctx.fillStyle='#120a17';ctx.fillRect(0,0,W,H)}
  for(const {obs:o,g} of S.results){
    const [x1,y1,x2,y2]=[o.box[0]*W,o.box[1]*H,o.box[2]*W,o.box[3]*H],col=gcol(g.grade);
    if(document.getElementById('vid').hidden){ // stand-in onion shape so boxes have something to sit on
      ctx.fillStyle='#7a2a55';ctx.beginPath();ctx.ellipse((x1+x2)/2,(y1+y2)/2,(x2-x1)/2.2,(y2-y1)/2.4,0,0,7);ctx.fill();
      if(o.defects[0]){ctx.fillStyle='rgba(60,30,10,.7)';ctx.beginPath();ctx.arc(x1+(x2-x1)*.35,y1+(y2-y1)*.4,(x2-x1)*.12,0,7);ctx.fill()}
    }
    ctx.strokeStyle=col;ctx.lineWidth=2.5*k;ctx.strokeRect(x1,y1,x2-x1,y2-y1);
    const d=o.defects[0];
    const lines=[`ONION #${o.id}  ${g.grade.toUpperCase()}`,d?`${DEFECTS[d.type]} ~${d.area}% visible`:'No visible surface defect',`Conf ${Math.round(o.conf*100)}%`];
    ctx.font=`${10*k}px system-ui`;const w=Math.max(...lines.map(l=>ctx.measureText(l).width))+8*k,h=lines.length*12*k+6*k;
    const ty=y1-h<0?y2:y1-h;ctx.fillStyle=col;ctx.globalAlpha=.9;ctx.fillRect(x1,ty,w,h);ctx.globalAlpha=1;
    ctx.fillStyle='#fff';lines.forEach((l,i)=>ctx.fillText(l,x1+4*k,ty+(i+1)*12*k));
  }
}

function report(r){
  const gc={},dc={};r.onions.forEach(o=>{gc[o.g.grade]=(gc[o.g.grade]||0)+1;o.obs.defects.forEach(d=>dc[DEFECTS[d.type]]=(dc[DEFECTS[d.type]]||0)+1)});
  const el=sheet(`${r.sim?'<div class="banner b-demo">DEMO / SIMULATED results</div>':''}
   <h2>Batch results</h2><p class="dim">Standard: ${esc(r.std)}</p>
   <p><b style="font-size:20px">Total detected: ${r.onions.length}</b></p>
   ${Object.entries(gc).map(([k,n])=>`<div>${esc(k)}: ${n}</div>`).join('')}
   <h3 style="margin-top:12px;font-size:15px">Visible defect distribution</h3>
   ${Object.keys(dc).length?Object.entries(dc).map(([k,n])=>`<div>${esc(k)}: ${n}</div>`).join(''):'<div>None</div>'}
   <p class="dim">${NOTICE}</p>
   <table>${r.onions.map((o,i)=>`<tr data-i="${i}" style="cursor:pointer"><td>#${o.obs.id}</td><td><span class="pill" style="background:${gcol(o.g.grade)}">${esc(o.g.grade)}</span></td><td>${o.obs.defects.map(d=>DEFECTS[d.type]+' '+d.area+'%').join(', ')||'No visible defect'}</td></tr>`).join('')}</table>
   <div style="margin-top:12px">${r.saved?'':'<button class="btn" id="sv">Save to history</button>'}<button class="btn alt" id="cl">Close</button></div>`);
  el.querySelectorAll('tr[data-i]').forEach(t=>t.onclick=()=>explain(r.onions[t.dataset.i],r.sim));
  const sv=el.querySelector('#sv');if(sv)sv.onclick=()=>{
    S.history.unshift({time:r.time,sim:r.sim,std:r.std,onions:r.onions.map(o=>({obs:o.obs,g:{...o.g,std:{name:o.g.std.name,version:o.g.std.version,verified:o.g.std.verified}}}))});
    saveH();sv.textContent='Saved';sv.disabled=true};
  el.querySelector('#cl').onclick=()=>el.remove();
}
function explain(o,sim){
  const g=o.g,s=g.std,kv=(k,v)=>`<div class="kv"><b>${k}</b>${v}</div>`;
  const el=sheet(`${sim?'<div class="banner b-demo">DEMO / SIMULATED</div>':''}${s.verified?'':'<div class="banner b-warn">STANDARD UNVERIFIED (placeholder rules)</div>'}
   <h2>Onion #${o.obs.id}</h2>
   ${kv('QUALITY CLASS',esc(g.grade))}${kv('STANDARD',esc(s.name)+' (v'+esc(s.version)+')')}
   ${kv('DETECTED',o.obs.defects.map(d=>DEFECTS[d.type]).join(', ')||'No visible surface defects')}
   ${kv('MEASURED',o.obs.defects.map(d=>d.area+'% of visible surface (estimate)').join('; ')||'-')}
   ${kv('APPLICABLE RULES',g.criteria.map(c=>`<div class="${c.st}">${{ok:'OK',fail:'FAIL',chk:'CHECK'}[c.st]} ${esc(c.nm)}: ${esc(c.rule)}</div>`).join('')||'-')}
   ${kv('AI CONFIDENCE',Math.round(o.obs.conf*100)+'%')}${kv('WHY',esc(g.why))}
   <p class="dim" style="margin-top:12px">${NOTICE}</p><button class="btn alt" id="cl">Close</button>`);
  el.querySelector('#cl').onclick=()=>el.remove();
}
function sheet(html){const e=document.createElement('div');e.className='sheet';e.innerHTML='<div>'+html+'</div>';
  e.onclick=ev=>{if(ev.target===e)e.remove()};document.body.appendChild(e);return e}

function standards(v){
  v.innerHTML=`<h2>Standards</h2><p class="dim">One standard at a time. They are never blended.</p>`+STANDARDS.map(s=>`
  <details class="card" ${s.id===S.stdId?'open':''}><summary><b>${esc(s.name)}</b><br><span class="${s.verified?'ok':'fail'}">${s.verified?'Verified':'UNVERIFIED placeholder'}</span></summary>
   <p class="dim">Authority: ${esc(s.authority)}<br>Country: ${s.country} &middot; Version: ${esc(s.version)}<br>Document: ${esc(s.doc)}<br>Source: <a style="color:var(--leaf)" href="${s.url}" target="_blank" rel="noopener">${s.url}</a></p>
   <p class="dim"><i>${esc(s.note)}</i></p>
   <table><tr><th>Grade</th><th>Defect</th><th>Rule</th></tr>${s.rules.map(r=>`<tr><td>${GRADES.find(g=>g.id===r.g).name}</td><td>${DEFECTS[r.d]}</td><td>${esc(r.text)}${r.max!=null?` [max ${r.max}%]`:''}${r.manual?' [human check]':''}<br><span class="dim">src: ${esc(r.src)}</span></td></tr>`).join('')}</table>
   <p class="dim">Lot tolerance (informational): 10% by number or weight may fall to the next class. Not applied per onion.</p></details>`).join('');
}

function ref(v){
  v.innerHTML=`<h2>Reference Library</h2><p class="dim">Metadata only. No images bundled or redistributed. Every entry is REFERENCE_ONLY until licence is confirmed.</p>`+
  REF.map(r=>`<div class="card"><b>${r.id} &middot; ${r.auth}</b><div class="dim">${r.page}<br>License: UNKNOWN<br>Usage: REFERENCE_ONLY<br>ML training permitted: NO</div></div>`).join('')+
  `<h3 style="margin-top:16px">Varieties</h3><p class="dim">Names only. Colour, shape, region and season not yet verified from official sources. Variety never decides grade.</p><p>${VARIETIES.map(x=>`<span class="pill" style="background:var(--line);margin:2px">${x}</span>`).join('')}</p>`;
}

function history(v){
  v.innerHTML=`<h2>Scan History</h2>`+(S.history.length?S.history.map((h,i)=>`<div class="card" data-i="${i}" style="cursor:pointer"><b>${h.onions.length} onions</b> ${h.sim?'<span class="pill" style="background:#a85f0a">DEMO / SIMULATED</span>':''}<div class="dim">${new Date(h.time).toLocaleString()}<br>${esc(h.std)}</div></div>`).join('')+'<button class="btn alt" id="clr">Clear history</button>':'<p class="dim">No saved scans. Run a scan and tap Save.</p>');
  v.querySelectorAll('[data-i]').forEach(c=>c.onclick=()=>report({...S.history[c.dataset.i],saved:true}));
  const c=v.querySelector('#clr');if(c)c.onclick=()=>{S.history=[];saveH();history(v)};
}

function more(v){
  const cfg=rfConfig();
  v.innerHTML=`<h2>Settings</h2>
  <h3 style="margin-top:14px;font-size:15px">Model connection</h3>
  ${rfConfigured()?'<div class="banner b-ok">Connected to your Roboflow model.</div>':'<div class="banner b-warn">Not connected. Add your endpoint and key below.</div>'}
  <label>Roboflow model endpoint<input id="rfEp" type="text" placeholder="https://detect.roboflow.com/your-project/1" value="${esc(cfg.endpoint)}"></label>
  <label>Roboflow API key<input id="rfKey" type="password" placeholder="paste your Publishable/API key" value="${esc(cfg.key)}"></label>
  <button class="btn alt" id="rfSave">Save connection</button>
  <p class="dim">Find these in your Roboflow project &rarr; Deploy tab &rarr; Hosted API. Classes cuts / rotten / sprout are mapped to this app's cracks / rot / sprouting rules (see CLASS_MAP in code). Stored only in this browser's local storage &mdash; never sent anywhere but your Roboflow endpoint.</p>
  <h3 style="margin-top:20px;font-size:15px">Grading</h3>
  <label>Grading standard<select id="std">${STANDARDS.map(s=>`<option value="${s.id}" ${s.id===S.stdId?'selected':''}>${esc(s.name)}${s.verified?'':' (unverified)'}</option>`).join('')}</select></label>
  <label>Manual-inspection threshold: <b id="cv">${Math.round(S.minConf*100)}%</b><input id="mc" type="range" min="30" max="95" value="${S.minConf*100}"></label>
  <p class="dim">Privacy: nothing is uploaded except the still frame sent to your own Roboflow endpoint when you tap Analyze.</p>
  <h2 style="margin-top:20px">Model evaluation</h2>
  ${rfConfigured()?'<div class="banner b-ok">Live model connected. Accuracy numbers below are whatever Roboflow reports for your trained version \u2014 check your project\u2019s Health Check / Versions tab for measured precision, recall and mAP.</div>':'<div class="banner b-warn">NO MEASURED RESULTS. No model connected yet. The demo scanner says nothing about accuracy.</div>'}
  <table>${['Precision','Recall','F1','mAP@0.5','Mask IoU','Latency (ms)','FPS','Model size','Device'].map(k=>`<tr><td>${k}</td><td class="dim">${rfConfigured()?'see Roboflow project':'not measured'}</td></tr>`).join('')}</table>
  <h2 style="margin-top:20px">Limits</h2>
  <p class="dim">Only visible surface traits are assessed. Internal rot, disease, moisture, residues and contamination cannot be seen by an RGB camera and are not claimed.</p>`;
  v.querySelector('#std').onchange=e=>{S.stdId=e.target.value;saveH()};
  v.querySelector('#mc').oninput=e=>{S.minConf=e.target.value/100;v.querySelector('#cv').textContent=e.target.value+'%'};
  v.querySelector('#rfSave').onclick=()=>{
    try{
      localStorage.setItem('og_rf_endpoint',v.querySelector('#rfEp').value.trim());
      localStorage.setItem('og_rf_key',v.querySelector('#rfKey').value.trim());
    }catch(e){}
    more(v);
  };
}

nav();render();
</script>
</body>
</html>
